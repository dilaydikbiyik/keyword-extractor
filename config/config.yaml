# Sectoral Keyword Extraction — pipeline configuration
#
# Every key below is read by src/utils/config.py and acted on by the pipeline.
# Options that change nothing have been removed rather than left as decoration;
# if you add one, wire it in the same commit.

# Embedding model
embedding:
  model_name: "paraphrase-multilingual-MiniLM-L12-v2"
  device: "cpu"            # "cuda" if a GPU is available

# Text preprocessing
preprocessing:
  remove_urls: true
  remove_emails: true
  lowercase: true
  remove_punctuation: true
  preserve_hyphens: true   # keep hyphens and apostrophes inside tokens
  min_word_length: 3
  max_ngram_length: 3

# Sector classification
classification:
  top_k_sectors: 3         # candidate sections reported per document
  # Similarity below which a candidate is not reported. It does NOT affect the
  # top-1 prediction, which always comes from the full unfiltered ranking.
  # At 0.5, most documents report fewer than three candidates.
  confidence_threshold: 0.5
  # Send the cleaned text to the classifier instead of the raw purpose field.
  # Worth +6.7 points on the current 30-document set (results/tables/ablation.md),
  # which is two documents and not significant — off until the set is larger.
  classify_preprocessed_text: false

# Keyword extraction
extraction:
  guided_mode: true        # seed the extraction with the predicted section's keywords
  top_n_final: 10          # keywords returned per document
  diversity: 0.7           # MMR diversity; higher means less redundant keywords

# Keyword filtering
filtering:
  min_score: 0.1           # candidates below this score are dropped

# Logging. INFO follows every pipeline step; WARNING keeps normal runs quiet.
logging:
  level: "WARNING"

# Paths
paths:
  taxonomy: "data/taxonomy/"
