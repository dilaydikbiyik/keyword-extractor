[metadata]
name = keyword-extractor
version = 1.0.0
description = Zero-shot NACE Rev. 2 classification of German trade register texts by embedding class descriptions, with the experiments behind the paper 'What a Class Description Buys'.
long_description = file: README.md
long_description_content_type = text/markdown
author = Dilay Dikbıyık
author_email = dilaydikbiyik@gmail.com
keywords =
    zero-shot classification
    keyword extraction
    NLP
    KeyBERT
    sentence transformers
    sector classification
    NACE
    German
    multilingual
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Text Processing :: Linguistic
python_requires = >=3.9

[options]
packages = find:
package_dir =
    = src
install_requires =
    keybert>=0.8.0
    sentence-transformers>=2.6.0
    scikit-learn>=1.3.0
    pandas>=2.0.0
    numpy>=1.24.0
    nltk>=3.8.0
    langdetect>=1.0.9
    pyyaml>=6.0
    tqdm>=4.66.0

[options.extras_require]
llm =
    openai>=1.0.0
translation =
    sentencepiece>=0.2.0
dev =
    pytest>=7.4.0
    flake8>=6.0.0

[options.packages.find]
where = src

[tool:pytest]
testpaths = tests
markers =
    slow: loads the embedding model; deselect with -m "not slow"

[flake8]
max-line-length = 120
exclude = .git,__pycache__,.venv,build,dist,paper
# E203/W503 disagree with black-style slicing and line breaks; E226 flags
# "=" * 60 banners; E704 flags the one-line Protocol stubs in experiments/systems.py.
extend-ignore = E203,W503,E226,E704
per-file-ignores =
    # These modules add src/ to sys.path before importing from it, so their
    # imports cannot sit at the top of the file.
    tests/*.py:E402
    main.py:E402
    quickstart.py:E402
    # The class descriptions are experimental stimuli: one line per class keeps
    # them directly comparable, which is worth more here than the width limit.
    experiments/run_replication.py:E501
    experiments/run_reuters.py:E501
