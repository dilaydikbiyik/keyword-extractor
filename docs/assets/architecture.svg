<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="Sectoral Keyword Extraction pipeline architecture">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98a1b2"/>
    </marker>
    <marker id="arrowTax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6fc4"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#fbfbfd"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

    <text x="32" y="40" font-size="19" font-weight="700" fill="#14161a">Sectoral Keyword Extraction Pipeline</text>
    <text x="32" y="62" font-size="12.5" fill="#5b6270">German trade register purpose → NACE Rev. 2 section + sector-aware keywords. No labelled training data.</text>

    <!-- input -->
    <rect x="32" y="88" width="500" height="48" rx="8" fill="#eef1f6" stroke="#c3cbd8"/>
    <text x="52" y="110" font-size="13" font-weight="600" fill="#14161a">Raw purpose text (German)</text>
    <text x="52" y="127" font-size="11.5" fill="#5b6270">9,993 Handelsregister records · 34.8% Top-1, 67.2% Top-3</text>

    <!-- stage 1 -->
    <rect x="32" y="164" width="500" height="58" rx="8" fill="#ffffff" stroke="#c3cbd8"/>
    <circle cx="58" cy="193" r="13" fill="#e6ecf5"/>
    <text x="58" y="197" font-size="12.5" font-weight="700" fill="#33405a" text-anchor="middle">1</text>
    <text x="82" y="188" font-size="13.5" font-weight="600" fill="#14161a">TextPreprocessor</text>
    <text x="82" y="207" font-size="11.5" fill="#5b6270">Language detection · URL/e-mail stripping · stopwords · n-gram candidates</text>

    <!-- stage 2 -->
    <rect x="32" y="238" width="500" height="58" rx="8" fill="#ffffff" stroke="#c3cbd8"/>
    <circle cx="58" cy="267" r="13" fill="#e6ecf5"/>
    <text x="58" y="271" font-size="12.5" font-weight="700" fill="#33405a" text-anchor="middle">2</text>
    <text x="82" y="262" font-size="13.5" font-weight="600" fill="#14161a">EmbeddingService</text>
    <text x="82" y="281" font-size="11.5" fill="#5b6270">paraphrase-multilingual-MiniLM-L12-v2 · 384-dim · MD5 disk cache</text>

    <!-- stage 3 -->
    <rect x="32" y="312" width="500" height="70" rx="8" fill="#ffffff" stroke="#8a6fc4" stroke-width="2"/>
    <circle cx="58" cy="347" r="13" fill="#ece3f8"/>
    <text x="58" y="351" font-size="12.5" font-weight="700" fill="#5a3f96" text-anchor="middle">3</text>
    <text x="82" y="336" font-size="13.5" font-weight="600" fill="#14161a">SectorClassifier</text>
    <text x="82" y="355" font-size="11.5" fill="#5b6270">Zero-shot cosine similarity over 21 section vectors</text>
    <text x="82" y="373" font-size="11.5" font-weight="600" fill="#5a3f96">vector = mean(description_emb, seed_list_emb)</text>

    <!-- stage 4 -->
    <rect x="32" y="398" width="500" height="58" rx="8" fill="#ffffff" stroke="#c3cbd8" stroke-dasharray="5 4"/>
    <circle cx="58" cy="427" r="13" fill="#e6ecf5"/>
    <text x="58" y="431" font-size="12.5" font-weight="700" fill="#33405a" text-anchor="middle">4</text>
    <text x="82" y="422" font-size="13.5" font-weight="600" fill="#14161a">KeywordExtractor</text>
    <text x="82" y="441" font-size="11.5" fill="#5b6270">Guided KeyBERT · seeds of the predicted section · MMR diversity</text>

    <!-- stage 5 -->
    <rect x="32" y="472" width="500" height="58" rx="8" fill="#ffffff" stroke="#c3cbd8" stroke-dasharray="5 4"/>
    <circle cx="58" cy="501" r="13" fill="#e6ecf5"/>
    <text x="58" y="505" font-size="12.5" font-weight="700" fill="#33405a" text-anchor="middle">5</text>
    <text x="82" y="496" font-size="13.5" font-weight="600" fill="#14161a">KeywordFilter</text>
    <text x="82" y="515" font-size="11.5" fill="#5b6270">Quality → dedup → relevance → information value → min score → top-K</text>

    <!-- stage 6 -->
    <rect x="32" y="546" width="500" height="46" rx="8" fill="#f7f8fa" stroke="#d5dae3" stroke-dasharray="5 4"/>
    <circle cx="58" cy="569" r="13" fill="#edeff3"/>
    <text x="58" y="573" font-size="12.5" font-weight="700" fill="#6b7383" text-anchor="middle">6</text>
    <text x="82" y="565" font-size="13" font-weight="600" fill="#6b7383">LLMValidator — optional, off by default</text>
    <text x="82" y="582" font-size="11.5" fill="#8a90a0">Only for the 0.3–0.6 confidence band</text>

    <!-- vertical flow -->
    <g stroke="#98a1b2" stroke-width="1.6" fill="none">
      <path d="M160 136 V162" marker-end="url(#arrow)"/>
      <path d="M160 222 V236" marker-end="url(#arrow)"/>
      <path d="M160 296 V310" marker-end="url(#arrow)"/>
      <path d="M160 382 V396" marker-end="url(#arrow)"/>
      <path d="M160 456 V470" marker-end="url(#arrow)"/>
      <path d="M160 530 V544" marker-end="url(#arrow)"/>
    </g>

    <!-- evidence panel -->
    <rect x="596" y="88" width="272" height="188" rx="8" fill="#ffffff" stroke="#c3cbd8"/>
    <text x="616" y="114" font-size="13" font-weight="700" fill="#14161a">What the ablation credits</text>
    <text x="616" y="140" font-size="11.5" fill="#2f7d4f">− seed vector</text>
    <text x="848" y="140" font-size="11.5" font-weight="600" fill="#2f7d4f" text-anchor="end">−6.4 pp</text>
    <text x="616" y="160" font-size="11.5" fill="#96601f">− description vector</text>
    <text x="848" y="160" font-size="11.5" font-weight="600" fill="#96601f" text-anchor="end">0.0 pp</text>
    <text x="616" y="180" font-size="11.5" fill="#96601f">− guided extraction</text>
    <text x="848" y="180" font-size="11.5" font-weight="600" fill="#96601f" text-anchor="end">0.0 pp</text>
    <text x="616" y="200" font-size="11.5" fill="#96601f">− keyword filter</text>
    <text x="848" y="200" font-size="11.5" font-weight="600" fill="#96601f" text-anchor="end">0.0 pp</text>
    <line x1="616" y1="214" x2="848" y2="214" stroke="#e2e6ec"/>
    <text x="616" y="234" font-size="11" fill="#5b6270">Dashed stages show no measurable effect</text>
    <text x="616" y="250" font-size="11" fill="#5b6270">on 299 corpus-sampled documents.</text>
    <text x="616" y="266" font-size="11" fill="#5b6270">Only the seed vector is significant.</text>

    <!-- taxonomy -->
    <rect x="596" y="300" width="272" height="92" rx="8" fill="#f3eefa" stroke="#8a6fc4"/>
    <text x="616" y="324" font-size="13" font-weight="600" fill="#14161a">NACE Rev. 2 taxonomy</text>
    <text x="616" y="343" font-size="11.5" fill="#5b6270">21 sections · 340 hand-written seeds</text>
    <text x="616" y="365" font-size="11.5" fill="#5a3f96">→ section vectors (stage 3)</text>
    <text x="616" y="382" font-size="11.5" fill="#5a3f96">→ guidance seeds (stage 4)</text>

    <g stroke="#8a6fc4" stroke-width="1.6" fill="none">
      <path d="M594 330 H534" marker-end="url(#arrowTax)"/>
      <path d="M640 392 V427 H534" marker-end="url(#arrowTax)"/>
    </g>

    <!-- output -->
    <rect x="596" y="472" width="272" height="120" rx="8" fill="#eef1f6" stroke="#c3cbd8"/>
    <text x="616" y="496" font-size="13" font-weight="600" fill="#14161a">Output JSON</text>
    <text x="616" y="518" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#33405a">top_sector: "J"</text>
    <text x="616" y="536" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#33405a">confidence: 0.62</text>
    <text x="616" y="554" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#33405a">top3: ["J", "M", "K"]</text>
    <text x="616" y="572" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#33405a">keywords: [...]</text>
    <path d="M534 569 H594" stroke="#98a1b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  </g>
</svg>
